[package]
name = "codebase-intelligence-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Mock runtime exercises the real shell-plugin launcher without opening a UI.
# This enables a feature of the already approved Tauri crate; no new package.
tauri = { version = "2", features = ["test"] }
